name: db-backup

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 Asia/Bangkok (UTC+7)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL https://downloads.rclone.org/v1.71.0/rclone-v1.71.0-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m 0755 /tmp/rclone-v1.71.0-linux-amd64/rclone /usr/local/bin/rclone
          rclone version

      - name: Configure rclone remote
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Dump, upload, prune
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          RCLONE_REMOTE: ${{ vars.BACKUP_RCLONE_REMOTE || 'gdrive:backups/student-management' }}
          RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
        run: bash scripts/backup-db.sh
