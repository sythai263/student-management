_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  # GoTrue builds email links as {API_EXTERNAL_URL}/verify — route it so
  # default templates (signup confirm, recovery) work through Kong too.
  - name: auth-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-verify
        strip_path: false
        paths:
          - /verify

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  # Realtime websocket — supabase-js connects to
  # {SUPABASE_URL}/realtime/v1/websocket -> realtime:4000/socket/websocket.
  # The `realtime-dev` upstream hostname makes Realtime resolve the
  # seeded tenant (external_id = first label of the Host header).
  - name: realtime-v1
    url: http://realtime-dev:4000/socket
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      # Cookies are port-agnostic: auth tokens from localhost:3000 get sent
      # here too and exceed Cowboy's 4KB header-value limit -> 431.
      - name: request-transformer
        config:
          remove:
            headers:
              - cookie
      # realtime (Phoenix/Cowboy) doesn't negotiate subprotocols, but
      # supabase-js may send "phoenix, base64url.bearer.phx.<token>". Chrome
      # kills the connection when the server doesn't echo; it ALSO fails when
      # the server echoes a protocol the client never requested (client sends
      # no subprotocols until setAuth resolves) — so echo only on request.
      - name: post-function
        config:
          header_filter:
            - |
              if kong.request.get_header("sec-websocket-protocol") then
                kong.response.set_header("Sec-WebSocket-Protocol", "phoenix")
              end
