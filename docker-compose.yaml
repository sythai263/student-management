name: student-management

# Local Supabase-compatible stack + MinIO (S3).
# Required env (put in .env):
#   POSTGRES_PASSWORD        - DB password
#   JWT_SECRET               - >= 32 chars, used to sign auth tokens
#   ANON_KEY / SERVICE_ROLE_KEY - JWTs signed with JWT_SECRET
#     (generate: https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys)
#   MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
#   S3_BUCKET                - e.g. student-management

services:
  db:
    image: supabase/postgres:17.6.1.169
    container_name: sm-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.196.0
    container_name: sm-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${KONG_PORT:-8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Apply app schema AFTER gotrue has created auth.users (FK target).
  migrate:
    image: supabase/postgres:17.6.1.169
    container_name: sm-migrate
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      for f in /migrations/*.sql; do
        echo \"Applying $$f\";
        psql -v ON_ERROR_STOP=1 -h db -U supabase_admin -d postgres -f $$f;
      done
      "

  rest:
    image: postgrest/postgrest:v14.17
    container_name: sm-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    healthcheck:
      # postgrest image is static — no wget/curl; use its built-in check.
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API gateway — single entrypoint for the app (NEXT_PUBLIC_SUPABASE_URL).
  kong:
    image: kong:3.9.3
    container_name: sm-kong
    restart: unless-stopped
    ports:
      - "${KONG_PORT:-8000}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth
    volumes:
      - ./supabase/kong.yml:/home/kong/kong.yml:ro

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sm-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create the app bucket once MinIO is up.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: sm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${S3_BUCKET:-student-management};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-student-management}

volumes:
  db-data:
  minio-data:
