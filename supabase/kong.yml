_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  # GoTrue builds email links as {API_EXTERNAL_URL}/verify — route it so
  # default templates (signup confirm, recovery) work through Kong too.
  - name: auth-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-verify
        strip_path: false
        paths:
          - /verify

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  # Realtime websocket — supabase-js connects to
  # {SUPABASE_URL}/realtime/v1/websocket -> realtime:4000/socket/websocket
  - name: realtime-v1
    url: http://realtime:4000/socket
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
